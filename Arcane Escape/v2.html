    <div id="controls">

    <script>
// ============================================================
//  ARCANE ESCAPE  –  Misztikus Dungeon Puzzle-Platformer
//  Egy-karakteres kaland, Lost Vikings / Fireboy stílusban
// ============================================================
'use strict';

const cv = document.getElementById('canvas');
const cx = cv.getContext('2d');
const W = cv.width;   // 800
const H = cv.height;  // 480
const TS = 32;        // tile size

// ── INPUT ───────────────────────────────────────────────────
const K = {}, JP = {};
addEventListener('keydown', e => {
    if (!K[e.code]) JP[e.code] = true;
    K[e.code] = true;
    e.preventDefault();
});
addEventListener('keyup', e => K[e.code] = false);
const kd = (...c) => c.some(x => K[x]);
const jp = (...c) => c.some(x => JP[x]);
const clrJP = () => { for (const k in JP) delete JP[k]; };

// ── MATH UTILS ──────────────────────────────────────────────
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── CAMERA ──────────────────────────────────────────────────
let camX = 0, camY = 0;
function updateCamera(px, py, mapW, mapH) {
    camX = clamp(px - W / 2, 0, Math.max(0, mapW * TS - W));
    camY = clamp(py - H / 2, 0, Math.max(0, mapH * TS - H));
}
const sx = x => x - camX;
const sy = y => y - camY;

// ── PARTICLE SYSTEM ─────────────────────────────────────────
const ptxList = [];
function addPtx(x, y, vx, vy, col, life, sz = 3) {
    ptxList.push({ x, y, vx, vy, col, life, l0: life, sz });
}
function burst(x, y, col, n = 8, spd = 2) {
    for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i / n) + (Math.random() - 0.5) * 0.5;
        const s = spd * (0.5 + Math.random() * 0.5);
        addPtx(x, y, Math.cos(a) * s, Math.sin(a) * s - 0.5, col, 25 + Math.random() * 20);
    }
}
function updatePtx() {
    for (let i = ptxList.length - 1; i >= 0; i--) {
        const p = ptxList[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.08;
        if (--p.life <= 0) ptxList.splice(i, 1);
    }
}
function drawPtx() {
    ptxList.forEach(p => {
        cx.globalAlpha = Math.max(0, p.life / p.l0);
        cx.fillStyle = p.col;
        cx.beginPath();
        cx.arc(sx(p.x), sy(p.y), p.sz * (p.life / p.l0), 0, Math.PI * 2);
        cx.fill();
    });
    cx.globalAlpha = 1;
}

// ── TILES ───────────────────────────────────────────────────
const T = { EMPTY: 0, STONE: 1, PLATF: 2, SPIKE: 3, LAVA: 4 };
let tiles = [];

function getTile(c, r) {
    if (r < 0 || r >= tiles.length || c < 0 || c >= tiles[0].length) return T.STONE;
    return tiles[r][c] ?? T.EMPTY;
}
const isSolid = id => id === T.STONE;
const isDanger = id => id === T.SPIKE || id === T.LAVA;

function drawBackground(mapW, mapH) {
    // Dark gradient background
    const grad = cx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0d0020');
    grad.addColorStop(1, '#050010');
    cx.fillStyle = grad;
    cx.fillRect(0, 0, W, H);
    
    // Stars
    cx.fillStyle = '#ffffff';
    // use seeded positions for consistency
    for (let i = 0; i < 60; i++) {
        const si = i * 7919; // pseudo-random
        const sx2 = ((si * 13 + 17) % (mapW * TS));
        const sy2 = ((si * 23 + 37) % (mapH * TS));
        const a = (Math.sin(t * 0.02 + i) * 0.5 + 0.5) * 0.7 + 0.1;
        cx.globalAlpha = a;
        cx.fillRect(sx(sx2), sy(sy2), 1, 1);
    }
    cx.globalAlpha = 1;
}

function drawTiles() {
    for (let r = 0; r < tiles.length; r++) {
        for (let c = 0; c < tiles[r].length; c++) {
            const id = tiles[r][c];
            if (id === T.EMPTY) continue;
            const dx = sx(c * TS), dy = sy(r * TS);
            if (dx + TS < 0 || dx > W || dy + TS < 0 || dy > H) continue; // cull
            
            switch (id) {
                case T.STONE: drawStoneTile(dx, dy); break;
                case T.PLATF: drawPlatfTile(dx, dy); break;
                case T.SPIKE: drawSpikeTile(dx, dy); break;
                case T.LAVA:  drawLavaTile(dx, dy); break;
            }
        }
    }
}

function drawStoneTile(x, y) {
    cx.fillStyle = '#2a1e3e';
    cx.fillRect(x, y, TS, TS);
    // Brick pattern
    cx.fillStyle = '#1a1028';
    cx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
    cx.strokeStyle = '#3a2856';
    cx.lineWidth = 1;
    // Mortar lines
    cx.beginPath();
    cx.moveTo(x, y + 10); cx.lineTo(x + TS, y + 10);
    cx.moveTo(x, y + 22); cx.lineTo(x + TS, y + 22);
    cx.moveTo(x + 8, y); cx.lineTo(x + 8, y + 10);
    cx.moveTo(x + 20, y + 10); cx.lineTo(x + 20, y + 22);
    cx.moveTo(x + 14, y + 22); cx.lineTo(x + 14, y + TS);
    cx.stroke();
    // Slight highlight on top-left
    cx.fillStyle = 'rgba(120, 80, 200, 0.08)';
    cx.fillRect(x, y, TS, 2);
    cx.fillRect(x, y, 2, TS);
}

function drawPlatfTile(x, y) {
    // Draw only the top portion of the tile
    cx.fillStyle = '#4a2a10';
    cx.fillRect(x, y, TS, 10);
    cx.fillStyle = '#6a3a18';
    cx.fillRect(x, y, TS, 4);
    // Little planks
    cx.fillStyle = '#5a3014';
    cx.fillRect(x + 8, y, 1, 10);
    cx.fillRect(x + 16, y, 1, 10);
    cx.fillRect(x + 24, y, 1, 10);
}

function drawSpikeTile(x, y) {
    cx.fillStyle = '#303030';
    cx.fillRect(x, y + TS * 0.6, TS, TS * 0.4);
    cx.fillStyle = '#808080';
    for (let i = 0; i < 4; i++) {
        const sx2 = x + i * 8 + 2;
        cx.beginPath();
        cx.moveTo(sx2, y + TS);
        cx.lineTo(sx2 + 3, y + TS * 0.4);
        cx.lineTo(sx2 + 6, y + TS);
        cx.fill();
    }
    cx.fillStyle = '#c0c0c0';
    for (let i = 0; i < 4; i++) {
        const sx2 = x + i * 8 + 2;
        cx.beginPath();
        cx.moveTo(sx2 + 3, y + TS * 0.4);
        cx.lineTo(sx2 + 4, y + TS * 0.5);
        cx.lineTo(sx2 + 5, y + TS * 0.4);
        cx.fill();
    }
}

let t = 0; // global timer
function drawLavaTile(x, y) {
    const wave = Math.sin(t * 0.05 + x * 0.1) * 2;
    const grad = cx.createLinearGradient(x, y, x, y + TS);
    grad.addColorStop(0, '#ff6600');
    grad.addColorStop(0.3, '#ff3300');
    grad.addColorStop(1, '#880000');
    cx.fillStyle = grad;
    cx.fillRect(x, y + wave, TS, TS);
    cx.fillStyle = `rgba(255, 150, 0, ${0.3 + Math.sin(t * 0.1 + x) * 0.15})`;
    cx.fillRect(x, y, TS, 4);
}

// ── ENTITY PHYSICS ──────────────────────────────────────────
const GRAV = 0.52;
const MAX_FALL = 14;

function resolveEntityTile(ent) {
    // Horizontal
    ent.x += ent.vx;
    const left = Math.floor(ent.x / TS);
    const right = Math.floor((ent.x + ent.w - 1) / TS);
    const midR = Math.floor((ent.y + ent.h / 2) / TS);
    const midRa = Math.floor((ent.y + 2) / TS);
    const midRb = Math.floor((ent.y + ent.h - 2) / TS);

    if (ent.vx > 0) {
        if (isSolid(getTile(right, midRa)) || isSolid(getTile(right, midRb))) {
            ent.x = right * TS - ent.w;
            ent.vx = 0;
        }
    } else if (ent.vx < 0) {
        if (isSolid(getTile(left, midRa)) || isSolid(getTile(left, midRb))) {
            ent.x = (left + 1) * TS;
            ent.vx = 0;
        }
    }

    // Vertical
    ent.vy = Math.min(ent.vy + GRAV, MAX_FALL);
    ent.y += ent.vy;
    ent.onGround = false;

    const top = Math.floor(ent.y / TS);
    const bot = Math.floor((ent.y + ent.h - 1) / TS);
    const midC = Math.floor((ent.x + ent.w / 2) / TS);
    const leftC = Math.floor((ent.x + 2) / TS);
    const rightC = Math.floor((ent.x + ent.w - 2) / TS);

    if (ent.vy > 0) {
        // Landing on solid
        if (isSolid(getTile(leftC, bot)) || isSolid(getTile(rightC, bot))) {
            ent.y = bot * TS - ent.h;
            ent.vy = 0;
            ent.onGround = true;
        }
        // Landing on one-way platform (only from above)
        else if ((getTile(leftC, bot) === T.PLATF || getTile(rightC, bot) === T.PLATF) && 
                 (ent.y + ent.h - ent.vy) <= bot * TS) {
            ent.y = bot * TS - ent.h;
            ent.vy = 0;
            ent.onGround = true;
        }
    } else if (ent.vy < 0) {
        if (isSolid(getTile(leftC, top)) || isSolid(getTile(rightC, top))) {
            ent.y = (top + 1) * TS;
            ent.vy = 0;
        }
    }

    // Danger tiles
    const dBot = Math.floor((ent.y + ent.h) / TS);
    if (isDanger(getTile(midC, dBot)) || isDanger(getTile(leftC, dBot)) || isDanger(getTile(rightC, dBot))) {
        ent.onDanger = true;
    }
}

// ── PLAYER ──────────────────────────────────────────────────
let player;
function createPlayer(x, y) {
    return {
        x, y, w: 20, h: 28,
        vx: 0, vy: 0,
        onGround: false,
        hp: 3, maxHp: 3,
        invincible: 0, // frames of invincibility
        attackCooldown: 0,
        attacking: false,
        attackTimer: 0,
        dir: 1, // 1=right, -1=left
        animFrame: 0,
        animTimer: 0,
        gemCount: 0,
    };
}

function drawPlayer(p) {
    const x = sx(p.x);
    const y = sy(p.y);
    const fl = p.dir < 0; // flip left
    
    // Invincibility flash
    if (p.invincible > 0 && Math.floor(t / 3) % 2 === 0) return;
    
    cx.save();
    if (fl) {
        cx.translate(x + p.w, y);
        cx.scale(-1, 1);
    } else {
        cx.translate(x, y);
    }

    // Robe/body
    cx.fillStyle = '#7040c0';
    cx.fillRect(2, 8, 16, 20);
    
    // Hood
    cx.fillStyle = '#5030a0';
    cx.beginPath();
    cx.arc(10, 8, 8, Math.PI, 0);
    cx.fill();
    cx.fillRect(3, 4, 14, 10);
    
    // Face
    cx.fillStyle = '#f0d090';
    cx.fillRect(4, 6, 12, 8);
    
    // Eyes
    cx.fillStyle = '#c080ff';
    cx.fillRect(6, 8, 3, 3);
    cx.fillRect(11, 8, 3, 3);
    
    // White of eyes
    cx.fillStyle = 'rgba(255,255,255,0.5)';
    cx.fillRect(7, 8, 1, 2);
    cx.fillRect(12, 8, 1, 2);
    
    // Robe detail
    cx.fillStyle = '#9060e0';
    cx.fillRect(2, 8, 2, 20); // left stripe
    
    // Staff
    cx.fillStyle = '#8050a0';
    cx.fillRect(17, 4, 3, 24); // staff body
    cx.fillStyle = '#c0a0ff';
    cx.fillRect(16, 2, 5, 4); // staff top
    
    // Magic gem on staff
    cx.fillStyle = `hsl(${270 + Math.sin(t * 0.08) * 30}, 100%, 70%)`;
    cx.beginPath();
    cx.arc(18, 2, 3, 0, Math.PI * 2);
    cx.fill();
    
    // Glow effect for staff gem
    cx.globalAlpha = 0.3 + Math.sin(t * 0.08) * 0.15;
    cx.fillStyle = '#c080ff';
    cx.beginPath();
    cx.arc(18, 2, 7, 0, Math.PI * 2);
    cx.fill();
    cx.globalAlpha = 1;
    
    // Attack effect
    if (p.attacking) {
        const progress = 1 - p.attackTimer / 12;
        const atkColor = `rgba(200, 150, 255, ${0.8 - progress * 0.6})`;
        cx.fillStyle = atkColor;
        cx.beginPath();
        cx.moveTo(18, 8);
        cx.arc(18, 8, 20 * progress, -Math.PI/4, Math.PI/4);
        cx.fill();
    }
    
    cx.restore();
}

function updatePlayer() {
    if (!player) return;
    
    // Movement
    let moveX = 0;
    if (kd('ArrowLeft', 'KeyA')) { moveX = -3; player.dir = -1; }
    if (kd('ArrowRight', 'KeyD')) { moveX = 3; player.dir = 1; }
    player.vx = moveX;
    
    // Jump
    if (jp('ArrowUp', 'KeyW', 'Space') && player.onGround) {
        player.vy = -11;
        burst(player.x + player.w/2, player.y + player.h, '#8060c0', 6, 1.5);
    }
    
    // Attack
    if (jp('KeyF', 'KeyZ') && player.attackCooldown <= 0) {
        player.attacking = true;
        player.attackTimer = 12;
        player.attackCooldown = 25;
    }
    if (player.attacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) player.attacking = false;
    }
    if (player.attackCooldown > 0) player.attackCooldown--;
    
    // Interact
    if (jp('KeyE')) {
        doInteract();
    }
    
    // Physics
    resolveEntityTile(player);
    
    // Object collisions
    for (const obj of gameObjects) {
        handlePlayerObjectCollision(obj);
    }
    
    // Enemy collision
    if (player.invincible <= 0) {
        for (const en of enemies) {
            if (en.dead) continue;
            if (rectsOverlap(player, en)) {
                hurtPlayer(1, en);
            }
        }
    }
    
    // Attack enemies
    if (player.attacking) {
        const atkRange = 35;
        for (const en of enemies) {
            if (en.dead) continue;
            const ex = en.x + en.w/2;
            const ey = en.y + en.h/2;
            const px = player.x + player.w/2 + player.dir * atkRange/2;
            const py = player.y + player.h/2;
            if (Math.abs(ex - px) < atkRange && Math.abs(ey - py) < 20) {
                hurtEnemy(en, 1);
            }
        }
    }
    
    // Invincibility cooldown
    if (player.invincible > 0) player.invincible--;
    
    // Danger tile check
    if (player.onDanger) {
        hurtPlayer(3); // instant death from lava
        player.onDanger = false;
    }
    
    // Update camera
    updateCamera(player.x + player.w/2, player.y + player.h/2, 
                 tiles[0].length, tiles.length);
    
    // Spawn magic dust from staff
    if (Math.random() < 0.3) {
        addPtx(
            player.x + (player.dir > 0 ? player.w + 5 : -5),
            player.y + 5,
            (Math.random() - 0.5) * 1.5,
            -0.5 - Math.random(),
            `hsl(${270 + Math.random() * 60}, 100%, 70%)`,
            15 + Math.random() * 15,
            1.5
        );
    }
}

function updateHUD() {
    document.getElementById('hp').textContent =
        '❤'.repeat(player.hp);

    document.getElementById('gems').textContent =
        `💎 ${player.gemCount}`;
}

function hurtPlayer(dmg, from = null) {
    if (player.invincible > 0) return;
    player.hp -= dmg;
    player.invincible = 60;
    burst(player.x + player.w/2, player.y + player.h/2, '#ff4060', 10, 3);
    if (from) {
        player.vx = (player.x - from.x) > 0 ? 4 : -4;
        player.vy = -5;
    }
    updateHUD();
    if (player.hp <= 0) {
        player.hp = 0;
        gameState = 'dead';
        setTimeout(() => showMessage('💀 Elesett a mágus!', 'Újra → Enter'), 800);
    }
}

function hurtEnemy(en, dmg) {
    en.hp -= dmg;
    burst(en.x + en.w/2, en.y + en.h/2, '#ff8040', 6, 2);
    if (en.hp <= 0) {
        en.dead = true;
        burst(en.x + en.w/2, en.y + en.h/2, '#ffd060', 12, 3);
        player.gemCount += 1; // bonus for killing
        updateHUD();
    }
}

// ── GAME OBJECTS ────────────────────────────────────────────
let gameObjects = [];
let enemies = [];
let keys_collected = 0;
let keys_total = 0;

function handlePlayerObjectCollision(obj) {
    if (!rectsOverlap(player, obj)) return;
    
    switch (obj.type) {
        case 'key':
            if (!obj.collected) {
                obj.collected = true;
                keys_collected++;
                burst(obj.x + 12, obj.y + 12, '#ffd700', 12, 2.5);
                // Check if any gate can be opened
                for (const o of gameObjects) {
                    if (o.type === 'gate' && !o.open) {
                        o.open = true;
                        burst(o.x + 16, o.y + 16, '#ffd700', 15, 3);
                    }
                }
                updateHUD();
            }
            break;
        case 'gem':
            if (!obj.collected) {
                obj.collected = true;
                player.gemCount++;
                burst(obj.x + 8, obj.y + 8, '#e040ff', 8, 2);
                updateHUD();
            }
            break;
        case 'exit':
            if (!obj.used) {
                obj.used = true;
                burst(obj.x + 16, obj.y + 16, '#a0ffb0', 20, 4);
                gameState = 'levelcomplete';
                setTimeout(() => nextLevel(), 1500);
            }
            break;
    }
}

function doInteract() {
    // Find nearest lever
    for (const obj of gameObjects) {
        if (obj.type === 'lever') {
            const dx = Math.abs((player.x + player.w/2) - (obj.x + 12));
            const dy = Math.abs((player.y + player.h/2) - (obj.y + 16));
            if (dx < 40 && dy < 40) {
                obj.on = !obj.on;
                burst(obj.x + 12, obj.y + 12, obj.on ? '#80ff80' : '#ff8040', 8, 2);
                const currentLevel = {
                    tiles: L1T,
                    objects: L1O,
                    links: L1LINKS
                };
                // Activate linked doors
                for (const link of currentLevel.links.leverDoor) {
                    if (link[0] === obj.id) {
                        const door = gameObjects.find(o => o.type === 'door' && o.id === link[1]);
                        if (door) door.open = obj.on;
                    }
                }
            }
        }
    }
}

function drawGameObjects() {
    for (const obj of gameObjects) {
        if (obj.collected || obj.used) continue;
        const x = sx(obj.x), y = sy(obj.y);
        
        switch (obj.type) {
            case 'lever': drawLever(x, y, obj.on); break;
            case 'door': if (!obj.open) drawDoor(x, y, obj.w, obj.h); break;
            case 'barrier': if (!obj.open) drawBarrier(x, y, obj.w, obj.h); break;
            case 'gate': if (!obj.open) drawGate(x, y, obj.w, obj.h); break;
            case 'crate': drawCrate(sx(obj.x), sy(obj.y)); break;
            case 'plate': drawPlate(x, y, obj.active); break;
            case 'key': drawKey(x, y); break;
            case 'gem': drawGem(x, y); break;
            case 'exit': drawExit(x, y); break;
        }
    }
}

function drawLever(x, y, on) {
    // Base
    cx.fillStyle = '#604040';
    cx.fillRect(x + 6, y + 16, 20, 10);
    cx.fillStyle = '#804040';
    cx.fillRect(x + 8, y + 14, 16, 4);
    // Handle
    const angle = on ? -0.6 : 0.6;
    cx.save();
    cx.translate(x + 16, y + 18);
    cx.rotate(angle);
    cx.fillStyle = '#a06030';
    cx.fillRect(-2, -14, 4, 14);
    cx.fillStyle = '#c08040';
    cx.beginPath();
    cx.arc(0, -14, 4, 0, Math.PI * 2);
    cx.fill();
    cx.restore();
    // Glow when on
    if (on) {
        cx.globalAlpha = 0.4 + Math.sin(t * 0.1) * 0.1;
        cx.fillStyle = '#80ff80';
        cx.beginPath();
        cx.arc(x + 16, y + 10, 8, 0, Math.PI * 2);
        cx.fill();
        cx.globalAlpha = 1;
    }
    // 'E' prompt
    cx.fillStyle = '#c0c0c0';
    cx.font = '10px Courier New';
    cx.fillText('[E]', x + 4, y - 2);
}

function drawDoor(x, y, w, h) {
    cx.fillStyle = '#601800';
    cx.fillRect(x, y, w, h);

function updateEnemies() {
    enemies = enemies.filter(e => !e.dead);
    for (const en of enemies) {
        switch (en.type) {
            case 'slime': updateSlime(en); break;
            case 'bat': updateBat(en); break;
            case 'skeleton': updateSkeleton(en); break;
        }
    }
}

function updateSlime(sl) {
    sl.vx = sl.dir * sl.speed;
    sl.animTimer++;
    if (sl.animTimer > 20) { sl.animTimer = 0; sl.anim = !sl.anim; }
    
    // Check if about to walk off edge or into wall
    const nextX = sl.x + sl.vx;
    const footCol = Math.floor((sl.x + sl.w/2 + sl.dir * (sl.w/2 + 4)) / TS);
    const footRow = Math.floor((sl.y + sl.h + 2) / TS);
    const wallRow = Math.floor((sl.y + sl.h/2) / TS);
    
    if (isSolid(getTile(footCol, wallRow)) || // wall ahead
        !isSolid(getTile(footCol, footRow))) { // edge ahead
        sl.dir *= -1;
    }
    
    resolveEntityTile(sl);
}

function drawSlime(sl) {
    const x = sx(sl.x), y = sy(sl.y);
    const sq = sl.anim ? 1 : -1; // squish
    
    cx.save();
    cx.translate(x + sl.w/2, y + sl.h);
    cx.scale(1 + sq * 0.08, 1 - sq * 0.06);
    cx.translate(-(sl.w/2), -(sl.h));
    
    // Body
    cx.fillStyle = '#30a050';
    cx.beginPath();
    cx.ellipse(sl.w/2, sl.h * 0.55, sl.w/2 - 2, sl.h * 0.45, 0, 0, Math.PI * 2);
    cx.fill();
    cx.fillStyle = '#50c070';
    cx.beginPath();
    cx.ellipse(sl.w/2 - 2, sl.h * 0.45, sl.w/3, sl.h * 0.25, -0.2, 0, Math.PI * 2);
    cx.fill();
    
    // Eyes
    cx.fillStyle = '#ffffff';
    cx.beginPath();
    cx.arc(sl.w/2 - 5, sl.h * 0.4, 4, 0, Math.PI * 2);
    cx.arc(sl.w/2 + 5, sl.h * 0.4, 4, 0, Math.PI * 2);
    cx.fill();
    cx.fillStyle = '#000000';
    cx.beginPath();
    const eyeDir = sl.dir > 0 ? 1 : -1;
    cx.arc(sl.w/2 - 5 + eyeDir, sl.h * 0.4 + 1, 2, 0, Math.PI * 2);
    cx.arc(sl.w/2 + 5 + eyeDir, sl.h * 0.4 + 1, 2, 0, Math.PI * 2);
    cx.fill();
    
    // Glow
    cx.globalAlpha = 0.15;
    cx.fillStyle = '#40ff80';
    cx.beginPath();
    cx.ellipse(sl.w/2, sl.h * 0.55, sl.w/2 + 4, sl.h * 0.5, 0, 0, Math.PI * 2);
    cx.fill();
    cx.globalAlpha = 1;
    
    cx.restore();
}

function createSlime(x, y) {
    return { type: 'slime', x, y: y - 20, w: 24, h: 20, vx: 0, vy: 0, 
             dir: 1, speed: 1.2, hp: 2, maxHp: 2, dead: false, 
             onGround: false, anim: false, animTimer: 0 };
}

function updateBat(bat) {
    bat.phase += 0.05;
    bat.x += bat.vx;
    bat.y = bat.baseY + Math.sin(bat.phase) * 40;
    bat.animTimer = (bat.animTimer || 0) + 1;
    
    // Wall bounce
    const bCol = Math.floor((bat.x + (bat.vx > 0 ? bat.w : 0)) / TS);
    const bRow = Math.floor((bat.y + bat.h/2) / TS);
    if (isSolid(getTile(bCol, bRow))) bat.vx *= -1;
    
    // Clamp to level bounds
    if (bat.x < TS) { bat.x = TS; bat.vx = Math.abs(bat.vx); }
    const maxX = tiles[0].length * TS - TS - bat.w;
    if (bat.x > maxX) { bat.x = maxX; bat.vx = -Math.abs(bat.vx); }
}

function drawBat(bat) {
    const x = sx(bat.x), y = sy(bat.y);
    const wingFlap = Math.sin((bat.animTimer || 0) * 0.25) * 8;
    const fl = bat.vx < 0;
    
    cx.save();
    cx.translate(x + bat.w/2, y + bat.h/2);
    if (fl) cx.scale(-1, 1);
    
    // Wings
    cx.fillStyle = '#503070';
    // Left wing
    cx.beginPath();
    cx.moveTo(0, 0); cx.quadraticCurveTo(-14, -wingFlap, -20, 5); cx.quadraticCurveTo(-8, 10, 0, 6);
    cx.fill();
    // Right wing
    cx.beginPath();
    cx.moveTo(0, 0); cx.quadraticCurveTo(14, -wingFlap, 20, 5); cx.quadraticCurveTo(8, 10, 0, 6);
    cx.fill();
    // Body
    cx.fillStyle = '#352040';
    cx.beginPath();
    cx.ellipse(0, 3, 6, 8, 0, 0, Math.PI * 2);
    cx.fill();
    // Eyes
    cx.fillStyle = '#ff4040';
    cx.beginPath();
    cx.arc(-2, 0, 2, 0, Math.PI * 2);
    cx.arc(3, 0, 2, 0, Math.PI * 2);
    cx.fill();
    // Ears
    cx.fillStyle = '#503070';
    cx.beginPath();
    cx.moveTo(-3, -5); cx.lineTo(-1, -12); cx.lineTo(1, -5);
    cx.moveTo(1, -5); cx.lineTo(4, -12); cx.lineTo(6, -5);
    cx.fill();
    
    cx.restore();
}

function updateCrates() {
    for (const obj of gameObjects) {
        if (obj.type !== 'crate') continue;
        
        // Gravity
        resolveEntityTile(obj);
        
        // Check if player is pushing it
        if (kd('ArrowLeft', 'KeyA') && 
            player.x < obj.x + obj.w && 
            player.x + player.w > obj.x + obj.w &&
            Math.abs((player.y + player.h) - (obj.y + obj.h)) < 5) {
            obj.vx = -2;
        } else if (kd('ArrowRight', 'KeyD') && 
                   player.x + player.w > obj.x && 
                   player.x < obj.x &&
                   Math.abs((player.y + player.h) - (obj.y + obj.h)) < 5) {
            obj.vx = 2;
        } else {
            obj.vx = 0;
        }
        
        // Check plate activation
        for (const plate of gameObjects) {
            if (plate.type !== 'plate') continue;
            const wasActive = plate.active;
            plate.active = rectsOverlap(obj, { x: plate.x, y: plate.y - 20, w: plate.w, h: 24 });
            if (plate.active !== wasActive) {
                // Toggle linked barriers
                for (const link of currentLevel.links.plateBare) {
                    // plate index... hmm, need to know which plate this is
                    // Let me assign IDs to plates and barriers
                }
                burst(plate.x + 14, plate.y, plate.active ? '#80ff80' : '#ff8040', 8, 1.5);
            }
        }
    }
}

function resolvePlayerCrateCollision() {
    for (const obj of gameObjects) {
        if (obj.type !== 'crate') continue;
        
        // Check horizontal overlap
        const futurePlayer = {...player, x: player.x + player.vx};
        if (rectsOverlap(futurePlayer, obj)) {
            // Push crate in same direction as player
            obj.vx = player.vx;
            // Resolve crate movement first
            const prevCrateX = obj.x;
            resolveEntityTile(obj);
            // If crate didn't move as expected (hit wall), stop player
            if (obj.vx === 0 || (player.vx > 0 && obj.x <= prevCrateX) || 
                (player.vx < 0 && obj.x >= prevCrateX)) {
                player.vx = 0;
            } else {
                // Crate moved, player follows
                player.x = player.vx > 0 ? obj.x - player.w : obj.x + obj.w;
            }
        }
    }
}

            );
        }

        else {
            gameObjects.push({...obj});
        }
    }

    updateHUD();
    hideMessage();

    gameState = 'playing';
}

// ── KÖVETKEZŐ PÁLYA ─────────────────────────────────────────

function nextLevel() {

    const next = currentLevelIndex + 1;

    if (next >= levels.length) {
        showMessage(
            '🏆 Vége!',
            `Összes gem: ${player.gemCount}`
        );

        gameState = 'finished';
        return;
    }

    loadLevel(next);
}

// ── HALÁL UTÁNI ÚJRAINDÍTÁS ─────────────────────────────────

addEventListener('keydown', e => {

    if (
        e.code === 'Enter' &&
        gameState === 'dead'
    ) {
        loadLevel(currentLevelIndex);
    }
});

// első pálya indítása
loadLevel(0);

// --- Rajzolás ---
function draw() {
    drawBackground(tiles[0].length, tiles.length);
    drawTiles();

    drawGameObjects();

    enemies.forEach(en => {
        if (en.type === 'slime')
            drawSlime(en);
        else if (en.type === 'bat')
            drawBat(en);
    });

    drawPlayer(player);
    drawPtx();
}

// --- Frissítés ---
function update() {
    updatePlayer();
    updateEnemies();
    updateCrates();
    updatePtx();

    t++;
    clrJP();
}

// --- Fő ciklus ---
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();


</script>
</body>
</html>
